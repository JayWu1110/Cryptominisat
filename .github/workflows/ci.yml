name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests (no solver required)
        run: pytest tests/ -q -k "not SatSolve"

  sat-solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ensure solver is executable
        run: |
          chmod +x bin/cryptominisat5
          ./bin/cryptominisat5 --version | head -1

      - name: SAT solve tests (rounds 1–2)
        run: |
          pytest tests/test_present.py::TestSatSolveSmallRounds -q
